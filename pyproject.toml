[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jp-patent-rag"
version = "0.1.0"
description = "Evidence-first, fully local RAG for Japanese AI patent intelligence"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Seojoon Lee" }]
dependencies = [
  "fastapi>=0.116,<1",
  "fastembed>=0.7,<1",
  "httpx>=0.28,<1",
  "joblib>=1.5,<2",
  "numpy>=2.0,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "sudachidict-core>=20250129",
  "sudachipy>=0.6.10,<1",
  "tokenizers>=0.23,<1",
  "tqdm>=4.67,<5",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
patent-rag = "patent_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patent_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/patent_rag/pipeline/reporting.py" = ["E501"]
"src/patent_rag/pipeline/embedding_audit.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["patent_rag"]
ignore_missing_imports = true
