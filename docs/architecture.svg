<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Japanese Patent Intelligence RAG system architecture</title>
  <desc id="desc">Four-stage local RAG architecture covering data preparation, hybrid retrieval, grounded generation, and human review with tamper-evident audit logging.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6d5dfc"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17152b; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66627a; }
      .phase { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.2px; fill: #5b4ce0; }
      .node-title { font: 650 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17152b; text-anchor: middle; }
      .node-note { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #66627a; text-anchor: middle; }
      .edge-label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #746ca0; }
      .phase-box { fill: #f7f7ff; stroke: #d4d0ff; stroke-width: 2; }
      .node { fill: #ffffff; stroke: #6d5dfc; stroke-width: 2; }
      .edge { fill: none; stroke: #6d5dfc; stroke-width: 2.5; marker-end: url(#arrow); }
      .audit-edge { fill: none; stroke: #e24b5f; stroke-width: 2.2; stroke-dasharray: 9 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#ffffff"/>
  <text x="50" y="52" class="title">Japanese Patent Intelligence RAG</text>
  <text x="50" y="82" class="subtitle">Fully local evidence pipeline · hybrid retrieval · grounded generation · human governance</text>

  <rect x="40" y="110" width="1520" height="155" rx="18" class="phase-box"/>
  <text x="68" y="143" class="phase">01 · DATA FOUNDATION</text>
  <rect x="90" y="165" width="280" height="72" rx="12" class="node"/>
  <text x="230" y="195" class="node-title">Japanese patent JSONL</text>
  <text x="230" y="220" class="node-note">46,794 curated records</text>
  <rect x="460" y="165" width="280" height="72" rx="12" class="node"/>
  <text x="600" y="195" class="node-title">Validation + NFKC</text>
  <text x="600" y="220" class="node-note">gzip · UTF-8 · JSON</text>
  <rect x="830" y="165" width="280" height="72" rx="12" class="node"/>
  <text x="970" y="195" class="node-title">Patent section parser</text>
  <text x="970" y="220" class="node-note">abstract · claims · background</text>
  <rect x="1200" y="165" width="280" height="72" rx="12" class="node"/>
  <text x="1340" y="195" class="node-title">Section-aware chunks</text>
  <text x="1340" y="220" class="node-note">bounded embedding context</text>
  <path d="M370 201 H460" class="edge"/>
  <path d="M740 201 H830" class="edge"/>
  <path d="M1110 201 H1200" class="edge"/>

  <rect x="40" y="285" width="1520" height="175" rx="18" class="phase-box"/>
  <text x="68" y="318" class="phase">02 · HYBRID RETRIEVAL</text>
  <rect x="90" y="335" width="300" height="50" rx="10" class="node"/>
  <text x="240" y="367" class="node-title">BM25 + Sudachi</text>
  <rect x="90" y="395" width="300" height="50" rx="10" class="node"/>
  <text x="240" y="427" class="node-title">Multilingual E5-small</text>
  <rect x="590" y="350" width="330" height="78" rx="12" class="node"/>
  <text x="755" y="381" class="node-title">Reciprocal Rank Fusion</text>
  <text x="755" y="407" class="node-note">rank-based sparse + dense fusion</text>
  <rect x="1130" y="350" width="300" height="78" rx="12" class="node"/>
  <text x="1280" y="381" class="node-title">Evidence gate</text>
  <text x="1280" y="407" class="node-note">confidence · coherence · top-k</text>
  <path d="M390 360 H510 Q535 360 535 380 V389 H590" class="edge"/>
  <path d="M390 420 H510 Q535 420 535 398 V389 H590" class="edge"/>
  <path d="M920 389 H1130" class="edge"/>

  <rect x="40" y="480" width="1520" height="155" rx="18" class="phase-box"/>
  <text x="68" y="513" class="phase">03 · GROUNDED GENERATION</text>
  <rect x="170" y="535" width="320" height="72" rx="12" class="node"/>
  <text x="330" y="565" class="node-title">Ollama · Qwen3 1.7B</text>
  <text x="330" y="590" class="node-note">local structured generation</text>
  <rect x="640" y="535" width="320" height="72" rx="12" class="node"/>
  <text x="800" y="565" class="node-title">Citation validator</text>
  <text x="800" y="590" class="node-note">allow-listed [S#] references</text>
  <rect x="1110" y="535" width="320" height="72" rx="12" class="node"/>
  <text x="1270" y="565" class="node-title">FastAPI draft</text>
  <text x="1270" y="590" class="node-note">pending review by default</text>
  <path d="M490 571 H640" class="edge"/>
  <path d="M960 571 H1110" class="edge"/>

  <rect x="40" y="655" width="1520" height="185" rx="18" class="phase-box"/>
  <text x="68" y="688" class="phase">04 · REVIEW &amp; GOVERNANCE</text>
  <rect x="80" y="730" width="280" height="72" rx="12" class="node"/>
  <text x="220" y="760" class="node-title">Analyst UI</text>
  <text x="220" y="785" class="node-note">answer + source inspection</text>
  <rect x="450" y="730" width="280" height="72" rx="12" class="node"/>
  <text x="590" y="760" class="node-title">Human review</text>
  <text x="590" y="785" class="node-note">approve · revise · reject</text>
  <rect x="820" y="730" width="280" height="72" rx="12" class="node"/>
  <text x="960" y="760" class="node-title">Append-only audit</text>
  <text x="960" y="785" class="node-note">prompt · evidence · decision</text>
  <rect x="1190" y="730" width="280" height="72" rx="12" class="node"/>
  <text x="1330" y="760" class="node-title">SHA-256 verification</text>
  <text x="1330" y="785" class="node-note">tamper-evident event chain</text>
  <path d="M360 766 H450" class="edge"/>
  <path d="M730 766 H820" class="edge"/>
  <path d="M1100 766 H1190" class="edge"/>
  <path d="M1270 607 V682 Q1270 706 1246 706 H960 V730" class="audit-edge"/>
  <text x="1080" y="699" class="edge-label">generated event</text>

  <path d="M1340 237 V260 Q1340 275 1325 275 H240 V335" class="edge"/>
  <path d="M1280 428 V455 Q1280 470 1265 470 H330 V535" class="edge"/>
  <path d="M1270 607 V625 Q1270 645 1250 645 H220 V730" class="edge"/>

  <text x="50" y="885" class="subtitle">Trust boundary: local laptop only · no paid API · no cloud dependency · technical exploration, not legal advice</text>
</svg>
